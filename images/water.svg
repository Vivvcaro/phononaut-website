<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05212f"/><stop offset=".5" stop-color="#04202e"/><stop offset="1" stop-color="#031823"/>
    </linearGradient>
    <radialGradient id="pool" cx=".42" cy=".55" r=".55"><stop offset="0" stop-color="#083247" stop-opacity=".55"/><stop offset="1" stop-color="#083247" stop-opacity="0"/></radialGradient>
    <filter id="g40" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1840" height="1300"><feGaussianBlur stdDeviation="56.0"/></filter>
    <filter id="g14" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1840" height="1300"><feGaussianBlur stdDeviation="19.6"/></filter>
    <filter id="g4" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1840" height="1300"><feGaussianBlur stdDeviation="5.6"/></filter>
    <filter id="g2" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1840" height="1300"><feGaussianBlur stdDeviation="2.2"/></filter>
  <filter id="smoke" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1840" height="1300">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.012" numOctaves="3" seed="5" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="70" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="url(#deep)"/>
  <rect width="1440" height="900" fill="url(#pool)"/>
  <g fill="none" stroke-linecap="round" filter="url(#smoke)">
    <!-- main ribbon, left to bottom right -->
    <path d="M-20 300 C 90 300, 170 262, 245 280 S 360 330, 410 400 S 500 530, 600 560 S 860 575, 960 610 S 1080 690, 1140 760 S 1300 870, 1460 880" stroke="#1b6f8c" stroke-opacity=".35" stroke-width="70" filter="url(#g40)"/>
    <path d="M-20 300 C 90 300, 170 262, 245 280 S 360 330, 410 400 S 500 530, 600 560 S 860 575, 960 610 S 1080 690, 1140 760 S 1300 870, 1460 880" stroke="#2a8fb0" stroke-opacity=".45" stroke-width="16" filter="url(#g14)"/>
    <path d="M-20 300 C 90 300, 170 262, 245 280 S 360 330, 410 400 S 500 530, 600 560 S 860 575, 960 610 S 1080 690, 1140 760 S 1300 870, 1460 880" stroke="#46b3d1" stroke-opacity=".5" stroke-width="3" filter="url(#g4)"/>
    <path d="M 210 282 C 250 276, 300 292, 340 322" stroke="#6cc9e0" stroke-opacity=".45" stroke-width="2" filter="url(#g2)"/>
    <path d="M 470 495 C 520 535, 560 552, 600 558" stroke="#6cc9e0" stroke-opacity=".4" stroke-width="2.4" filter="url(#g2)"/>
    <path d="M 930 600 C 990 615, 1050 650, 1090 700" stroke="#5bbcd6" stroke-opacity=".35" stroke-width="2" filter="url(#g2)"/>
    <!-- a second, fainter strand beside the first -->
    <path d="M 420 470 C 520 590, 760 600, 980 640 S 1220 820, 1460 860" stroke="#1d6f8a" stroke-opacity=".28" stroke-width="10" filter="url(#g14)"/>
    <!-- faint curl, top right -->
    <path d="M 1080 150 C 1140 70, 1230 40, 1300 45 S 1400 110, 1460 190" stroke="#1d6f8a" stroke-opacity=".35" stroke-width="40" filter="url(#g40)"/>
    <path d="M 1100 140 C 1150 80, 1230 45, 1295 48 S 1390 105, 1450 180" stroke="#3aa2c3" stroke-opacity=".38" stroke-width="3" filter="url(#g4)"/>
    <path d="M 1270 40 C 1300 70, 1310 110, 1300 150" stroke="#3aa2c3" stroke-opacity=".3" stroke-width="10" filter="url(#g14)"/>
    <!-- very faint haze strands -->
    <path d="M 700 380 C 820 340, 960 330, 1100 300" stroke="#155a72" stroke-opacity=".25" stroke-width="60" filter="url(#g40)"/>
    <path d="M 1180 840 C 1220 860, 1240 900, 1230 930" stroke="#2a8fb0" stroke-opacity=".35" stroke-width="18" filter="url(#g14)"/>
  </g>
</svg>
