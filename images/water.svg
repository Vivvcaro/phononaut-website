<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#062231"/><stop offset=".5" stop-color="#041a26"/><stop offset="1" stop-color="#03111a"/>
    </linearGradient>
    <radialGradient id="light" cx=".3" cy=".35" r=".6"><stop offset="0" stop-color="#0d3d50" stop-opacity=".7"/><stop offset="1" stop-color="#0d3d50" stop-opacity="0"/></radialGradient>
    <filter id="ribbons" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0011 0.0042" numOctaves="2" seed="23" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.20  0 0 0 0 0.62  0 0 0 0 0.72  1 0 0 0 0" result="c"/>
      <feComponentTransfer in="c" result="veins"><feFuncA type="table" tableValues="0 0 0 0 0 0 0.02 0.42 0.02 0 0 0 0 0"/></feComponentTransfer>
      <feGaussianBlur in="veins" stdDeviation="3" result="soft"/>
      <feGaussianBlur in="veins" stdDeviation="26" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="soft"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#deep)"/>
  <rect width="1600" height="1000" fill="url(#light)"/>
  <rect width="1600" height="1000" filter="url(#ribbons)" opacity=".55"/>
</svg>
